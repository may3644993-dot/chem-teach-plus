                            newY = initialCropBoxRect.y + dy;
                            newH = potentialH;
                        }
                    } else if (activeCropHandle === 'tl') {
                        const potentialW = initialCropBoxRect.w - dx;
                        if (potentialW >= 30 && initialCropBoxRect.x + dx >= minX) {
                            newX = initialCropBoxRect.x + dx;
                            newW = potentialW;
                        }
                        const potentialH = initialCropBoxRect.h - dy;
                        if (potentialH >= 30 && initialCropBoxRect.y + dy >= minY) {
                            newY = initialCropBoxRect.y + dy;
                            newH = potentialH;
                        }
                    }

                    cropBox.style.left = `${newX}px`;
                    cropBox.style.top = `${newY}px`;
                    cropBox.style.width = `${newW}px`;
                    cropBox.style.height = `${newH}px`;
                }
            }

            function onCropPointerUp(e) {
                isCropBoxDragging = false;
                isCropBoxResizing = false;
                if (e && e.target && e.target.releasePointerCapture) {
                    try { e.target.releasePointerCapture(e.pointerId); } catch(err) {}
                }
            }

            cropBox.addEventListener('pointerdown', onCropPointerDown);
            window.addEventListener('pointermove', onCropPointerMove);
            window.addEventListener('pointerup', onCropPointerUp);

            resetOriginalBtn.onclick = () => {
                if (!currentTargetImgObj || !currentTargetImgObj.originalDataUrl) return;
                pushUndoState();

                const img = new Image();
                img.src = currentTargetImgObj.originalDataUrl;
                img.onload = () => {
                    currentTargetImgObj.dataUrl = currentTargetImgObj.originalDataUrl;
                    currentTargetImgObj.imgElement = img;
                    saveState();
                    redrawWorkspace();
                    cropModal.classList.add('hidden');
                    showToast("已恢復為原始全圖！");
                };
            };

            applyCropBtn.onclick = () => {
                if (!currentTargetImgObj) return;

                const imgRect = cropTargetImg.getBoundingClientRect();
                const containerRect = document.getElementById('crop-container').getBoundingClientRect();

                const cropX = parseFloat(cropBox.style.left) - (imgRect.left - containerRect.left);
                const cropY = parseFloat(cropBox.style.top) - (imgRect.top - containerRect.top);
                const cropW = parseFloat(cropBox.style.width);
                const cropH = parseFloat(cropBox.style.height);

                const scaleX = cropTargetImg.naturalWidth / imgRect.width;
                const scaleY = cropTargetImg.naturalHeight / imgRect.height;

                const sourceX = Math.max(0, cropX * scaleX);
                const sourceY = Math.max(0, cropY * scaleY);
                const sourceW = Math.min(cropTargetImg.naturalWidth - sourceX, cropW * scaleX);
                const sourceH = Math.min(cropTargetImg.naturalHeight - sourceY, cropH * scaleY);

                if (sourceW <= 0 || sourceH <= 0) return;

                const sliceCanvas = document.createElement('canvas');
                sliceCanvas.width = sourceW;
                sliceCanvas.height = sourceH;
                const sCtx = sliceCanvas.getContext('2d');

                sCtx.drawImage(
                    cropTargetImg,
                    sourceX, sourceY, sourceW, sourceH,
                    0, 0, sourceW, sourceH
                );

                const croppedDataUrl = sliceCanvas.toDataURL('image/png');

                pushUndoState();
                const newImg = new Image();
                newImg.src = croppedDataUrl;
                newImg.onload = () => {
                    currentTargetImgObj.dataUrl = croppedDataUrl;
                    currentTargetImgObj.imgElement = newImg;
                    
                    const ratio = sourceH / sourceW;
                    currentTargetImgObj.height = currentTargetImgObj.width * ratio;

                    saveState();
                    redrawWorkspace();
                    cropModal.classList.add('hidden');
                    showToast("圖片裁切成功！已呈現精準重點。");
                };
            };
        }

        function changePage(delta) {
            const classId = state.currentClassId;
            const activeTabId = state.currentTabId[classId];
            const activeTab = state.tabs[classId]?.find(t => t.id === activeTabId);
            if (!activeTab || activeTab.type !== 'pdf') return;

            const newPage = activeTab.currentPage + delta;
            if (newPage >= 1 && newPage <= activeTab.totalPages) {
                activeTab.currentPage = newPage;
                saveState();
                renderCurrentTab();
            }
        }

        function handlePointerDown(e) {
            const classId = state.currentClassId;
            const activeTabId = state.currentTabId[classId];
            if (!activeTabId) return;

            const activeTab = state.tabs[classId].find(t => t.id === activeTabId);
            const key = `${classId}_${activeTabId}_${activeTab.currentPage}`;
            if (!state.drawings[key]) state.drawings[key] = [];

            isMouseDown = true;
            const pt = getCanvasPos(e);
            state.lastMousePt = pt;

            if (state.pendingPasteClick) {
                pasteObjectsAt(pt);
                state.pendingPasteClick = false;
                hideBanner();
                return;
            }

            if (isSpacePressed) {
                dragStartPt = { x: e.clientX - state.panX, y: e.clientY - state.panY };
                drawingCanvas.style.cursor = 'grabbing';
                return;
            }

            hideContextMenus();

            if (state.currentTool === 'pen' || state.currentTool === 'highlighter') {
                pushUndoState();
                activeStroke = {
                    id: 'stroke-' + Date.now(),
                    type: 'stroke',
                    tool: state.currentTool,
                    color: state.brushColor,
                    size: state.brushSize,
                    points: [pt]
                };

                straightenStartPt = pt;
                holdStillPt = pt;
                isStraightened = false;
                lastTimerPt = pt;
                resetStraightenTimer(pt);

            } else if (state.currentTool === 'eraser') {
                isErasingHistoryPushed = false;
                isEraserModified = false;
                eraseAtPoint(pt, key);

            } else if (state.currentTool === 'stamp') {
                pushUndoState();
                isDrawingStamp = true;
                stampStartPt = pt;
                activePreviewStamp = {
                    stampType: state.selectedStamp,
                    x: pt.x,
                    y: pt.y,
                    scaleSize: 60,
                    angle: 0,
                    color: state.brushColor,
                    size: state.brushSize
                };

            } else if (state.currentTool === 'lasso') {
                if (selectedLassoObjects.length > 0) {
                    const bbox = getBoundingBox(selectedLassoObjects);
                    const handleKey = hitTestResizeHandle(pt, bbox);
                    if (handleKey) {
                        isResizingSelection = true;
                        activeResizeHandle = handleKey;
                        initialResizeBbox = bbox;
                        initialResizePt = pt;
                        initialObjectsSnapshot = JSON.parse(JSON.stringify(selectedLassoObjects));
                        pushUndoState();
                        return;
                    }

                    if (pt.x >= bbox.x && pt.x <= bbox.x + bbox.width && pt.y >= bbox.y && pt.y <= bbox.y + bbox.height) {
                        isDraggingSelection = true;
                        dragStartPt = pt;
                        pushUndoState();
                        return;
                    }
                }

                const hitObj = findHitObject(pt, key);
                if (hitObj) {
                    selectedLassoObjects = [hitObj];
                    isDraggingSelection = true;
                    dragStartPt = pt;
                    pushUndoState();
                    redrawWorkspace();
                    return;
                }

                selectedLassoObjects = [];
                lassoPath = [pt];

            } else if (state.currentTool === 'crop') {
                isCropping = true;
                cropStartPt = pt;
                cropEndPt = pt;
            }

            redrawWorkspace();
        }

        function handlePointerMove(e) {
            if (!isMouseDown) return;

            const classId = state.currentClassId;
            const activeTabId = state.currentTabId[classId];
            if (!activeTabId) return;

            const activeTab = state.tabs[classId].find(t => t.id === activeTabId);
            const key = `${classId}_${activeTabId}_${activeTab.currentPage}`;
            const pt = getCanvasPos(e);
            lastTimerPt = pt;

            if (isSpacePressed) {
                state.panX = e.clientX - dragStartPt.x;
                state.panY = e.clientY - dragStartPt.y;
                updateWorkspaceTransform();
                return;
            }

            if (state.currentTool === 'pen' || state.currentTool === 'highlighter') {
                if (activeStroke) {
                    if (!isStraightened) {
                        activeStroke.points.push(pt);
                        resetStraightenTimer(pt);
                    } else {
                        activeStroke.points[1] = pt;
                    }
                    redrawWorkspace();
                }

            } else if (state.currentTool === 'eraser') {
                eraseAtPoint(pt, key);

            } else if (state.currentTool === 'stamp' && isDrawingStamp && activePreviewStamp) {
                const dist = Math.hypot(pt.x - stampStartPt.x, pt.y - stampStartPt.y);
                const angle = Math.atan2(pt.y - stampStartPt.y, pt.x - stampStartPt.x);
                activePreviewStamp.scaleSize = Math.max(30, dist);
                activePreviewStamp.angle = angle;
                redrawWorkspace();

            } else if (state.currentTool === 'lasso') {
                if (isDraggingSelection && selectedLassoObjects.length > 0) {
                    const dx = pt.x - dragStartPt.x;
                    const dy = pt.y - dragStartPt.y;
                    dragStartPt = pt;

                    selectedLassoObjects.forEach(obj => {
                        if (obj.type === 'stroke') {
                            obj.points.forEach(p => { p.x += dx; p.y += dy; });
                        } else if (obj.type === 'image') {
                            obj.x += dx;
                            obj.y += dy;
                        }
                    });
                    redrawWorkspace();

                } else if (isResizingSelection && activeResizeHandle && initialResizeBbox) {
                    const dx = pt.x - initialResizePt.x;
                    const dy = pt.y - initialResizePt.y;
                    
                    let scaleX = 1;
                    let scaleY = 1;

                    if (activeResizeHandle === 'br') {
                        scaleX = (initialResizeBbox.width + dx) / initialResizeBbox.width;
                        scaleY = (initialResizeBbox.height + dy) / initialResizeBbox.height;
                    } else if (activeResizeHandle === 'tr') {
                        scaleX = (initialResizeBbox.width + dx) / initialResizeBbox.width;
                        scaleY = (initialResizeBbox.height - dy) / initialResizeBbox.height;
                    } else if (activeResizeHandle === 'bl') {
                        scaleX = (initialResizeBbox.width - dx) / initialResizeBbox.width;
                        scaleY = (initialResizeBbox.height + dy) / initialResizeBbox.height;
                    } else if (activeResizeHandle === 'tl') {
                        scaleX = (initialResizeBbox.width - dx) / initialResizeBbox.width;
                        scaleY = (initialResizeBbox.height - dy) / initialResizeBbox.height;
                    }

                    scaleX = Math.max(0.1, scaleX);
                    scaleY = Math.max(0.1, scaleY);

                    selectedLassoObjects.forEach((obj, idx) => {
                        const snap = initialObjectsSnapshot[idx];
                        if (obj.type === 'stroke') {
                            obj.points = snap.points.map(p => ({
                                x: initialResizeBbox.x + (p.x - initialResizeBbox.x) * scaleX,
                                y: initialResizeBbox.y + (p.y - initialResizeBbox.y) * scaleY
                            }));
                        } else if (obj.type === 'image') {
                            obj.x = initialResizeBbox.x + (snap.x - initialResizeBbox.x) * scaleX;
                            obj.y = initialResizeBbox.y + (snap.y - initialResizeBbox.y) * scaleY;
                            obj.width = Math.max(20, snap.width * scaleX);
                            obj.height = Math.max(20, snap.height * scaleY);
                        }
                    });
                    redrawWorkspace();

                } else if (lassoPath.length > 0) {
                    lassoPath.push(pt);
                    redrawWorkspace();
                }

            } else if (state.currentTool === 'crop' && isCropping) {
                cropEndPt = pt;
                redrawWorkspace();
            }
        }

        function handlePointerUp(e) {
            if (!isMouseDown) return;
            isMouseDown = false;
            clearTimeout(straightLineTimer);

            const classId = state.currentClassId;
            const activeTabId = state.currentTabId[classId];
            if (!activeTabId) return;

            const activeTab = state.tabs[classId].find(t => t.id === activeTabId);
            const key = `${classId}_${activeTabId}_${activeTab.currentPage}`;

            if (state.currentTool === 'pen' || state.currentTool === 'highlighter') {
                if (activeStroke && activeStroke.points.length > 0) {
                    if (!state.drawings[key]) state.drawings[key] = [];
                    state.drawings[key].push(activeStroke);
                    saveState();
                }
                activeStroke = null;

            } else if (state.currentTool === 'eraser') {
                if (isEraserModified) {
                    saveState();
                    isEraserModified = false;
                }

            } else if (state.currentTool === 'stamp' && isDrawingStamp && activePreviewStamp) {
                const strokes = convertStampToStrokes(activePreviewStamp);
                if (!state.drawings[key]) state.drawings[key] = [];
                state.drawings[key].push(...strokes);
                activePreviewStamp = null;
                isDrawingStamp = false;
                saveState();

            } else if (state.currentTool === 'lasso') {
                if (isDraggingSelection || isResizingSelection) {
                    isDraggingSelection = false;
                    isResizingSelection = false;
                    activeResizeHandle = null;
                    saveState();
                } else if (lassoPath.length > 2) {
                    selectedLassoObjects = findObjectsInLassoPoly(lassoPath, key);
                    lassoPath = [];
                    redrawWorkspace();
                }

            } else if (state.currentTool === 'crop' && isCropping) {
                isCropping = false;
                if (cropStartPt && cropEndPt) {
                    processScreenCrop(cropStartPt, cropEndPt);
                }
                cropStartPt = null;
                cropEndPt = null;
            }

            redrawWorkspace();
        }

        function eraseAtPoint(pt, key) {
            const radius = state.brushSize || 20;
            const objects = state.drawings[key] || [];
            let modified = false;

            for (let i = objects.length - 1; i >= 0; i--) {
                const obj = objects[i];
                if (obj.type === 'stroke') {
                    const newSegments = [];
                    let currentSeg = [];

                    obj.points.forEach(p => {
                        if (Math.hypot(p.x - pt.x, p.y - pt.y) <= radius) {
                            if (currentSeg.length > 0) {
                                newSegments.push(currentSeg);
                                currentSeg = [];
                            }
                        } else {
                            currentSeg.push(p);
                        }
                    });

                    if (currentSeg.length > 0) {
                        newSegments.push(currentSeg);
                    }

                    if (newSegments.length === 0) {
                        if (!isErasingHistoryPushed) { pushUndoState(); isErasingHistoryPushed = true; }
                        objects.splice(i, 1);
                        modified = true;
                    } else if (newSegments.length === 1) {
                        if (newSegments[0].length !== obj.points.length) {
                            if (!isErasingHistoryPushed) { pushUndoState(); isErasingHistoryPushed = true; }
                            obj.points = newSegments[0];
                            modified = true;
                        }
                    } else {
                        if (!isErasingHistoryPushed) { pushUndoState(); isErasingHistoryPushed = true; }
                        objects.splice(i, 1);
                        newSegments.forEach(seg => {
                            objects.push({
                                ...obj,
                                id: 'stroke-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4),
                                points: seg
                            });
                        });
                        modified = true;
                    }

                } else if (obj.type === 'image') {
                    if (pt.x >= obj.x && pt.x <= obj.x + obj.width && pt.y >= obj.y && pt.y <= obj.y + obj.height) {
                        if (!isErasingHistoryPushed) { pushUndoState(); isErasingHistoryPushed = true; }
                        objects.splice(i, 1);
                        modified = true;
                    }
                }
            }

            if (modified) {
                isEraserModified = true;
                redrawWorkspace();
            }
        }

        function findHitObject(pt, key) {
            const objects = state.drawings[key] || [];
            for (let i = objects.length - 1; i >= 0; i--) {
                const obj = objects[i];
                if (obj.type === 'image') {
                    if (pt.x >= obj.x && pt.x <= obj.x + obj.width && pt.y >= obj.y && pt.y <= obj.y + obj.height) {
                        return obj;
                    }
                } else if (obj.type === 'stroke') {
                    for (let p of obj.points) {
                        if (Math.hypot(p.x - pt.x, p.y - pt.y) <= Math.max(10, obj.size / 2)) {
                            return obj;
                        }
                    }
                }
            }
            return null;
        }

        function isPointInPoly(poly, pt) {
            let inside = false;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                const xi = poly[i].x, yi = poly[i].y;
                const xj = poly[j].x, yj = poly[j].y;
                const intersect = ((yi > pt.y) !== (yj > pt.y)) &&
                    (pt.x < (xj - xi) * (pt.y - yi) / (yj - yi) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function findObjectsInLassoPoly(poly, key) {
            const objects = state.drawings[key] || [];
            const selected = [];

            objects.forEach(obj => {
                if (obj.type === 'stroke') {
                    const anyPointInside = obj.points.some(p => isPointInPoly(poly, p));
                    if (anyPointInside) selected.push(obj);
                } else if (obj.type === 'image') {
                    const center = { x: obj.x + obj.width / 2, y: obj.y + obj.height / 2 };
                    if (isPointInPoly(poly, center)) selected.push(obj);
                }
            });

            return selected;
        }

        function copySelectedObjects() {
            if (selectedLassoObjects.length === 0) return;
            state.clipboard = JSON.parse(JSON.stringify(sanitizeDrawingsForStorage({ clip: selectedLassoObjects }).clip));
            hideContextMenus();
            showToast("已複製選取物件！點擊「貼上」即可複製到指定位置。");
        }

        function cutSelectedObjects() {
            if (selectedLassoObjects.length === 0) return;
            copySelectedObjects();
            deleteSelectedObjects();
        }

        function deleteSelectedObjects() {
            if (selectedLassoObjects.length === 0) return;
            pushUndoState();
            const classId = state.currentClassId;
            const activeTabId = state.currentTabId[classId];
            const activeTab = state.tabs[classId]?.find(t => t.id === activeTabId);
            if (!activeTab) return;
            const key = `${classId}_${activeTabId}_${activeTab.currentPage}`;

            const selectedIds = new Set(selectedLassoObjects.map(o => o.id));
            state.drawings[key] = (state.drawings[key] || []).filter(o => !selectedIds.has(o.id));

            selectedLassoObjects = [];
            hideContextMenus();
            saveState();
            redrawWorkspace();
            showToast("已刪除選取物件");
        }

        function pasteObjects() {
            if (!state.clipboard) return;
            const classId = state.currentClassId;
            const activeTabId = state.currentTabId[classId];
            const activeTab = state.tabs[classId]?.find(t => t.id === activeTabId);
            if (!activeTab) return;
            const key = `${classId}_${activeTabId}_${activeTab.currentPage}`;

            const bbox = getBoundingBox(state.clipboard);
            const targetPt = { x: bbox.x + 30, y: bbox.y + 30 };
            pasteObjectsAt(targetPt);
        }

        function pasteObjectsAt(targetPt) {
            if (!state.clipboard || state.clipboard.length === 0) return;
            pushUndoState();

            const classId = state.currentClassId;
            const activeTabId = state.currentTabId[classId];
            const activeTab = state.tabs[classId]?.find(t => t.id === activeTabId);
            if (!activeTab) return;
            const key = `${classId}_${activeTabId}_${activeTab.currentPage}`;

            const bbox = getBoundingBox(state.clipboard);
            const dx = targetPt.x - bbox.x;
            const dy = targetPt.y - bbox.y;

            const newObjects = JSON.parse(JSON.stringify(state.clipboard));
            newObjects.forEach(obj => {
                obj.id = (obj.type || 'obj') + '-' + Date.now() + '-' + Math.random().toString(36).substr(2, 4);
                if (obj.type === 'stroke') {
                    obj.points.forEach(p => { p.x += dx; p.y += dy; });
                } else if (obj.type === 'image') {
                    obj.x += dx;
                    obj.y += dy;
                    if (obj.dataUrl) {
                        const img = new Image();
                        img.src = obj.dataUrl;
                        obj.imgElement = img;
                        if (obj.isGif) {
                            img.id = 'gif-el-' + obj.id;
                            gifCacheContainer.appendChild(img);
                        }
                    }
                }
            });

            if (!state.drawings[key]) state.drawings[key] = [];
            state.drawings[key].push(...newObjects);

            selectedLassoObjects = newObjects;
            saveState();
            redrawWorkspace();
            showToast("已成功貼上！");
        }

        function processScreenCrop(p1, p2) {
            const x = Math.min(p1.x, p2.x);
            const y = Math.min(p1.y, p2.y);
            const w = Math.abs(p2.x - p1.x);
            const h = Math.abs(p2.y - p1.y);

            if (w < 20 || h < 20) return;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = w;
            tempCanvas.height = h;
            const tCtx = tempCanvas.getContext('2d');

            const classId = state.currentClassId;
            const activeTabId = state.currentTabId[classId];
            const activeTab = state.tabs[classId]?.find(t => t.id === activeTabId);

            if (activeTab && activeTab.type === 'pdf') {
                tCtx.drawImage(pdfCanvas, x, y, w, h, 0, 0, w, h);
            } else {
                tCtx.fillStyle = '#ffffff';
                tCtx.fillRect(0, 0, w, h);
            }

            tCtx.drawImage(drawingCanvas, x, y, w, h, 0, 0, w, h);

            const croppedDataUrl = tempCanvas.toDataURL('image/png');

            document.getElementById('export-modal-title').textContent = "剪取區域預覽";
            document.getElementById('export-preview-img').src = croppedDataUrl;
            document.getElementById('download-direct-btn').href = croppedDataUrl;
            document.getElementById('download-direct-btn').download = `化學白板剪貼_${Date.now()}.png`;

            const pasteBtn = document.getElementById('paste-cropped-to-canvas-btn');
            pasteBtn.classList.remove('hidden');
            pasteBtn.onclick = () => {
                const img = new Image();
                img.src = croppedDataUrl;
                img.onload = () => {
                    pushUndoState();
                    const key = `${classId}_${activeTabId}_${activeTab.currentPage}`;
                    const imgObj = {
                        id: 'img-' + Date.now(),
                        type: 'image',
                        isGif: false,
                        x: x + 40,
                        y: y + 40,
                        width: w,
                        height: h,
                        dataUrl: croppedDataUrl,
                        originalDataUrl: croppedDataUrl,
                        imgElement: img
                    };
                    if (!state.drawings[key]) state.drawings[key] = [];
                    state.drawings[key].push(imgObj);
                    saveState();
                    redrawWorkspace();
                    document.getElementById('export-modal').classList.add('hidden');
                    showToast("區域擷圖已貼回白板！");
                };
            };

            document.getElementById('export-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        function exportCanvasPNG() {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = drawingCanvas.width;
            tempCanvas.height = drawingCanvas.height;
            const tCtx = tempCanvas.getContext('2d');

            const classId = state.currentClassId;
            const activeTabId = state.currentTabId[classId];
            const activeTab = state.tabs[classId]?.find(t => t.id === activeTabId);

            if (activeTab && activeTab.type === 'pdf') {
                tCtx.drawImage(pdfCanvas, 0, 0);
            } else {
                tCtx.fillStyle = '#ffffff';
                tCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
            }

            tCtx.drawImage(drawingCanvas, 0, 0);

            const dataUrl = tempCanvas.toDataURL('image/png');

            document.getElementById('export-modal-title').textContent = "匯出全頁 PNG 圖片";
            document.getElementById('export-preview-img').src = dataUrl;
            document.getElementById('download-direct-btn').href = dataUrl;
            document.getElementById('download-direct-btn').download = `化學白板筆記_${Date.now()}.png`;
            document.getElementById('paste-cropped-to-canvas-btn').classList.add('hidden');

            document.getElementById('export-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        function showClassModal() {
            renderClassListModal();
            document.getElementById('class-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        function hideClassModal() {
            document.getElementById('class-modal').classList.add('hidden');
        }

        function renderClassListModal() {
            const container = document.getElementById('class-list-container');
            container.innerHTML = '';

            state.classes.forEach((c) => {
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between p-2 hover:bg-slate-100 rounded-lg text-sm text-slate-700';

                const nameSpan = document.createElement('span');
                nameSpan.className = 'font-semibold';
                nameSpan.textContent = c.name;

                const delBtn = document.createElement('button');
                delBtn.className = 'p-1 text-slate-400 hover:text-red-600 transition';
                delBtn.innerHTML = '<i data-lucide="trash-2" class="w-4 h-4"></i>';
                delBtn.onclick = () => {
                    if (state.classes.length <= 1) {
                        showToast("至少需保留一個班級！");
                        return;
                    }
                    state.classes = state.classes.filter(cls => cls.id !== c.id);
                    if (state.currentClassId === c.id) {
                        state.currentClassId = state.classes[0].id;
                    }
                    saveState();
                    setupClassSelect();
                    renderTabs();
                    renderCurrentTab();
                    renderClassListModal();
                    showToast(`已刪除班級：${c.name}`);
                };

                item.appendChild(nameSpan);
                item.appendChild(delBtn);
                container.appendChild(item);
            });

            lucide.createIcons();
        }
    </script>
</body>
